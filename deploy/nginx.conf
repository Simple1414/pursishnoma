# /etc/nginx/sites-available/researchsurvey  (replace survey.example.org)
# HTTPS certificates: sudo certbot --nginx -d survey.example.org
server {
    listen 80;
    server_name survey.example.org;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name survey.example.org;
    # ssl_certificate / ssl_certificate_key are added by certbot

    client_max_body_size 10m;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location /static/ {
        alias /srv/researchsurvey/app/staticfiles/;
        expires 30d;
        access_log off;
    }
    # Uploaded questionnaire sources are private: never served directly.
    location /media/ { return 404; }

    location / {
        proxy_pass http://unix:/run/researchsurvey/gunicorn.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 130s;
    }
}
