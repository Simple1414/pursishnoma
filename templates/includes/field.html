{% if field.is_hidden %}{{ field }}{% else %}
<div class="{% if field.field.widget.input_type == 'checkbox' %}flex items-start gap-3{% endif %}">
  {% if field.field.widget.input_type == 'checkbox' %}
    {{ field }}
    <div><label for="{{ field.id_for_label }}" class="text-sm font-medium">{{ field.label }}{% if field.field.required %} <span class="text-rs-danger" aria-hidden="true">*</span>{% endif %}</label>
    {% if help %}<p class="rs-help">{{ help }}</p>{% endif %}</div>
  {% else %}
    <label for="{{ field.id_for_label }}" class="rs-label">{{ field.label }}{% if field.field.required %} <span class="text-rs-danger" aria-hidden="true">*</span>{% endif %}</label>
    {{ field }}
    {% if help %}<p class="rs-help">{{ help }}</p>{% endif %}
  {% endif %}
  {% for e in field.errors %}<p class="rs-error">{{ e }}</p>{% endfor %}
</div>{% endif %}
